name: Deploy Ninja AF400EU app

on:
  push:
    branches: [main]
    paths:
      - 'ninja-af400eu/**'
      - '.github/workflows/deploy-ninja-app.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ninja-af400eu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ninja-af400eu/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          APP_BASE: /lazer/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ninja-af400eu/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
