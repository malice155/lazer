1 дойдёт до нуля, проверить курицу: внутри должно быть не меньше 75 °C.","Подавать курицу с овощами в тортилиях, картофель — рядом."],source:Oe},{id:"roast-chicken-root-veg",title:"Курица целиком с корнеплодами",titleOriginal:"Roast Chicken & Root Vegetables",category:"chicken",summary:"Полноценный воскресный обед в одном приборе: целая курица с лимоном и тимьяном плюс овощи с розмарином.",servings:"4 порции",prepMinutes:15,totalMinutes:65,mode:"SYNC",zones:[{zone:1,title:"Курица целиком",fn:"ROAST",tempC:190,minutes:50,plate:!0},{zone:2,title:"Корнеплоды",fn:"AIR FRY",tempC:190,minutes:35,plate:!0}],ingredients:[{title:"Курица",items:["Курица целиком 1,35 кг","1,5 ст. л. оливкового масла","Несколько веточек тимьяна","0,5 лимона, разрезать на четвертинки","4 зубчика чеснока, неочищенных, раздавить плоскостью ножа","Соль и перец по вкусу"]},{title:"Овощи",items:["450 г мелкого картофеля (около 8 шт.), разрезать вдоль пополам","250 г небольшой моркови (около 4 шт.), очистить и разрезать вдоль","250 г пастернака (около 2 шт.), очистить и разрезать вдоль на 4 части","2 средние красные луковицы, каждую разрезать на 4 дольки","3 ст. л. оливкового масла","Несколько веточек розмарина, разломать руками"]}],steps:["Посолить и поперчить курицу внутри. Заложить внутрь лимон, тимьян и чеснок. Снаружи смазать маслом и приправить.","Овощи сложить в миску, полить маслом, перемешать и приправить по вкусу.","Вставить решётку в корзину Зоны 1 и положить курицу. Вставить решётку в Зону 2 и выложить овощи.","Зона 1: ROAST, 190 °C, 50 минут. Зона 2: AIR FRY, 190 °C, 35 минут. Нажать SYNC и запустить диском.","Через 25 минут выбрать Зону 1 и снизить температуру до 160 °C, нажать диск для продолжения.","Добавить розмарин к овощам в Зоне 2 и перемешать.","Ещё пару раз перемешать овощи до конца готовки, чтобы они подрумянились равномерно. Курица готова при 75 °C внутри.","Разрезать курицу и подавать с овощами."],tips:["Сок, который собрался на дне корзины, — отличная основа для подливки."],source:Oe},{id:"beef-kofta",title:"Люля-кебаб из говядины с овощами и нутом",titleOriginal:"Beef Kofta & Roasted Vegetables",category:"meat",summary:"Ароматные колбаски из фарша с мятой и петрушкой, а рядом — морковь с нутом и кумином.",servings:"4 порции",prepMinutes:20,totalMinutes:45,mode:"SYNC",zones:[{zone:1,title:"Овощи с нутом",fn:"ROAST",tempC:190,minutes:25,plate:!1,shakeAt:[10,20]},{zone:2,title:"Люля-кебаб",fn:"MAX CRISP",minutes:10,plate:!0}],ingredients:[{title:"Овощи",items:["500 г моркови, нарезать","1 красная луковица, кубиком","2 зубчика чеснока, измельчить","250 г нута (отцедить)","1 ч. л. молотого кумина","0,5 ч. л. молотого кориандра","1 ч. л. соли","2 ст. л. оливкового масла","2 ст. л. рубленой петрушки"]},{title:"Кебаб",items:["500 г говяжьего фарша","50 г петрушки (листья и стебли)","2 веточки мяты, только листья","1 красная луковица","3 зубчика чеснока","3 ст. л. оливкового масла","0,5 ч. л. смеси специй «душистый перец»","1 ч. л. молотого кумина","0,5 ч. л. молотого кориандра","1 ч. л. соли"]}],steps:["В корзине Зоны 1 без решётки смешать все овощные ингредиенты, кроме петрушки. Вставить корзину в прибор.","В миске размять фарш. Мелко порубить вместе петрушку, мяту, лук и чеснок, добавить к мясу. Всыпать специи и соль, влить масло и вымесить руками до однородности.","Сформировать 8 одинаковых колбасок и выложить их на решётку в корзине Зоны 2. Вставить корзину.","Зона 1: ROAST, 190 °C, 25 минут. Зона 2: MAX CRISP, 10 минут. Нажать SYNC и запустить диском.","Через 10 минут встряхнуть овощи. Через 20 минут встряхнуть ещё раз и перевернуть кебабы.","В готовые овощи добавить рубленую петрушку и подавать вместе с кебабом."],tips:["Подавай с греческим йогуртом: 250 г йогурта смешать с 1 ст. л. хариссы."],source:Oe},{id:"calzone",title:"Кальцоне с салями и рикоттой",titleOriginal:"Salami & Ricotta Calzone",category:"meat",summary:"Закрытая пицца за 9 минут — по одной в каждой корзине, режим MATCH.",servings:"2 порции",prepMinutes:15,totalMinutes:24,mode:"MATCH",zones:[{zone:1,title:"Кальцоне",fn:"AIR FRY",tempC:220,minutes:9,plate:!0},{zone:2,title:"Кальцоне",fn:"AIR FRY",tempC:220,minutes:9,plate:!0}],ingredients:[{items:["350 г готового или домашнего теста для пиццы","150 г рикотты","125 г моцареллы, кубиками по 1,5 см, отцедить","6 ст. л. соуса для пиццы","40 г салями, нарезать полосками по 1 см","Горсть листьев базилика, порвать руками","Соль и перец по вкусу","Мука для раскатки","Масло-спрей","Оливковое масло extra virgin для подачи (по желанию)"]}],steps:["Разделить тесто на два одинаковых шара. Раскатать каждый в круг диаметром 26 см на присыпанной мукой поверхности.","Намазать на каждый круг половину рикотты, оставив 2,5 см от края. Посолить и поперчить. Сверху распределить по 2 ст. л. соуса, затем половину моцареллы, базилика и салями.","Смочить края теста водой, сложить пополам и плотно защипать, подворачивая край на себя.","Вставить решётки в обе корзины, сбрызнуть маслом и положить по кальцоне. Сверху размазать по 1 ст. л. соуса, не задевая защипанный край, сбрызнуть маслом и вставить корзины.","Зона 1: AIR FRY, 220 °C, 9 минут. Нажать MATCH, затем запустить диском.","Проверять с 8-й минуты: последняя минута решающая. На 8 минутах уже готово, ещё 20–30 секунд дадут более румяную корочку. Полные 9 минут могут пережечь верх — следи внимательно.","Подавать горячим, сбрызнув оливковым маслом."],tips:["Чтобы сделать вегетарианский вариант, просто не клади салями."],source:Oe},{id:"fried-pork-sweet-fries",title:"Свинина в панировке с фри из батата",titleOriginal:"Fried Pork & Sweet Potato Fries",category:"meat",summary:"Двойная панировка даёт настоящий хруст, а батат готовится рядом и поспевает вовремя.",servings:"2–4 порции",prepMinutes:20,totalMinutes:44,mode:"SYNC",zones:[{zone:1,title:"Свиные отбивные",fn:"ROAST",tempC:200,minutes:15,plate:!0},{zone:2,title:"Фри из батата",fn:"AIR FRY",tempC:180,minutes:24,plate:!0,shakeAt:[10,15,20]}],ingredients:[{items:["240 г пшеничной муки","1 ч. л. копчёной паприки","1 ч. л. чесночного порошка","1 ч. л. морской соли","1 ч. л. молотого чёрного перца","0,5 ч. л. порошка чили","2 крупных яйца","2–4 свиные отбивные без кости, разрезать вдоль пополам и отбить до 1 см","500 г замороженного фри из батата"]}],steps:["В широкой миске смешать муку, паприку, чесночный порошок, соль, перец и чили.","В другой миске тщательно взбить яйца.","По очереди обмакнуть каждую отбивную в яйцо, затем в муку со специями, снова в яйцо и снова в муку. Отложить.","Вставить решётки в обе корзины. Отбивные — в Зону 1, фри — в Зону 2.","Зона 1: ROAST, 200 °C, 15 минут. Зона 2: AIR FRY, 180 °C, 24 минуты. Нажать SYNC и запустить диском.","Через 10 минут вынуть корзину Зоны 2 и встряхнуть 10 секунд. Повторить через 15 и 20 минут.","Через 8 минут после старта Зоны 1 перевернуть отбивные силиконовыми щипцами.","Подавать отбивные с фри."],source:Oe},{id:"cheesy-baked-potatoes",title:"Картофель, запечённый с сыром и беконом",titleOriginal:"Cheesy Baked Potatoes",category:"meat",summary:"Картофель запекается целиком, затем начиняется своей же мякотью с беконом, чеддером и крем-фрешем и румянится ещё 8 минут.",servings:"4 порции",prepMinutes:15,totalMinutes:63,mode:"SYNC",zones:[{zone:1,title:"Картофель целиком",fn:"ROAST",tempC:200,minutes:40,plate:!0},{zone:2,title:"Лук с беконом",fn:"AIR FRY",tempC:200,minutes:15,plate:!1}],ingredients:[{items:["4 крупные картофелины для запекания (по 250–300 г)","1 луковица, кубиком","200 г копчёного бекона, нарезать кусочками","100 г чеддера, натереть","100 г чеддера, нарезать ломтиками","2 ст. л. крем-фреша","Соль","Перец"]}],steps:["Вымыть картофель и несколько раз проколоть кожуру вилкой. Вставить решётку в корзину Зоны 1 и положить картофель. В корзину Зоны 2 без решётки положить лук и бекон, перемешать.","Зона 1: ROAST, 200 °C, 40 минут. Зона 2: AIR FRY, 200 °C, 15 минут. Нажать SYNC и запустить диском.","Через 20 минут перевернуть картофель. Ещё через 15 минут перемешать содержимое второй корзины.","Проверить картофель кончиком ножа — он должен легко входить. Дать немного остыть, разрезать пополам и ложкой вынуть мякоть.","В миске размять мякоть с крем-фрешем, беконом, луком и тёртым чеддером, посолить и поперчить. Начинить этой массой картофельные лодочки и накрыть ломтиками чеддера.","Вставить решётку в корзину Зоны 2, разложить картофелины по обеим корзинам и вставить их в прибор. Выбрать AIR FRY, 200 °C, 8 минут, нажать MATCH и запустить диском.","Готовые картофелины переложить силиконовыми щипцами на тарелку и сразу подавать с салатом."],source:Oe},{id:"arancini",title:"Аранчини с грибами, ветчиной и сыром",titleOriginal:"Mushroom, Ham & Cheese Arancini",category:"snacks",summary:"Рисовые шарики с тягучим грюйером внутри и хрустящей корочкой панко снаружи.",servings:"12 шариков",prepMinutes:45,totalMinutes:65,mode:"MATCH",zones:[{zone:1,title:"Аранчини",fn:"AIR FRY",tempC:190,minutes:20,plate:!0},{zone:2,title:"Аранчини",fn:"AIR FRY",tempC:190,minutes:20,plate:!0}],ingredients:[{items:["250 г риса арборио","50 г сливочного масла","50 г тёртого пармезана","2 ч. л. оливкового масла","250 г каштановых шампиньонов, крупно порубить","2 зубчика чеснока, измельчить","90 г ветчины толстой нарезки, кубиками по 1 см","25 г петрушки","2 средних яйца, взбить","Около 50 г грюйера, нарезать на 12 кубиков по 2 см","Соль и перец по вкусу","Масло-спрей","75–100 г панировочных сухарей панко"]}],steps:["Отварить рис в подсоленной воде до мягкости (около 15 минут) и хорошо отцедить. Вмешать сливочное масло и пармезан. Разложить тонким слоем на противне и остудить.","Разогреть оливковое масло на сковороде и обжарить грибы, пока не выпарится жидкость. Добавить чеснок и готовить 2 минуты. Остудить.","В остывший рис вмешать грибы, ветчину, петрушку и яйца, приправить по вкусу. Снова разложить тонким слоем и остудить.","Разделить массу на 12 равных частей. Смачивая руки в холодной воде, сформировать шарики, в каждом сделать углубление, вложить кубик сыра и закрыть рисом. Выкладывать на противень с пергаментом.","Вставить решётки в обе корзины и сбрызнуть их маслом.","Обвалять каждый шарик в панко, разложить по корзинам, сбрызнуть маслом и вставить корзины в прибор.","Зона 1: AIR FRY, 190 °C, 20 минут. Нажать MATCH и запустить диском.","Подавать горячими."],source:Oe},{id:"lamb-kebabs",title:"Кебаб из баранины с баклажанами",titleOriginal:"Lamb Kebabs & Aubergine Wedges",category:"meat",summary:"Пряная баранина с бахаратом на шпажках и дольки баклажана — 15 минут и готово.",servings:"4 порции",prepMinutes:20,totalMinutes:37,mode:"SYNC",zones:[{zone:1,title:"Кебаб из баранины",fn:"AIR FRY",tempC:200,minutes:9,plate:!0},{zone:2,title:"Дольки баклажана",fn:"AIR FRY",tempC:200,minutes:15,plate:!0}],ingredients:[{items:["400 г бараньего фарша, холодного из холодильника","20 г свежих хлебных крошек, ненадолго замочить в холодной воде и отжать","1 зелёный лук, мелко нарезать","1 зубчик чеснока, измельчить","2 ч. л. смеси специй бахарат","1,5 ст. л. мелко рубленой кинзы","1,5 ст. л. мелко рубленой петрушки","2 ст. л. оливкового масла","2 баклажана (около 600 г), каждый разрезать на 6 долек","1 ч. л. соли","1 ч. л. перца","Петрушка и кинза для подачи","Хлопья чили алеппо (по желанию)","Масло-спрей","Тёплая питта для подачи","Понадобятся 4 деревянные шпажки 20 см, замоченные в воде"]}],steps:["Смешать в миске фарш, хлебные крошки, зелёный лук, чеснок, бахарат и рубленую зелень. Посолить и поперчить. Разделить массу на четыре части и налепить на шпажки, оставив 4 см у края.","Баклажаны перемешать с 2 ст. л. масла и приправить.","Вставить решётку в корзину Зоны 1, сбрызнуть маслом и выложить кебабы, разворачивая их в разные стороны, чтобы поместились. Вставить корзину.","Вставить решётку в корзину Зоны 2, выложить баклажаны и вставить корзину.","Обе зоны: AIR FRY, 200 °C. Зона 1 — 9 минут, Зона 2 — 15 минут. Нажать SYNC и запустить диском.","Баклажаны аккуратно перевернуть хотя бы дважды за время готовки, чтобы подрумянились равномерно. К концу проверить — им может понадобиться пара лишних минут.","Подавать горячим с тёплой питтой, посыпав зеленью и по желанию хлопьями чили."],tips:["Мятный соус: 150 мл греческого йогурта, горсть рубленой мяты и соль по вкусу."],source:Oe},{id:"fish-n-chips",title:"Фиш-энд-чипс: треска под лимонной корочкой",titleOriginal:"Fish 'n' Chips",category:"fish",summary:"Треска под хлебно-лимонной шапкой и настоящий английский картофель — классика в двух корзинах.",servings:"4 порции",prepMinutes:10,totalMinutes:36,mode:"SYNC",zones:[{zone:1,title:"Картофель",fn:"AIR FRY",tempC:200,minutes:26,plate:!0,shakeAt:[10,15,20]},{zone:2,title:"Треска",fn:"ROAST",tempC:170,minutes:14,plate:!0}],ingredients:[{title:"Картофель",items:["700 г крахмалистого картофеля","2 ст. л. подсолнечного масла","Морская соль","2 ч. л. манной крупы (по желанию, для хруста)","Долька лимона и петрушка для подачи"]},{title:"Рыба",items:["2 ломтика подсохшего хлеба без корки, порвать на куски","1 зубчик чеснока","Цедра 1 лимона","5 г свежей петрушки с стеблями","Морская соль и перец по вкусу","4 толстых филе трески без кожи по 120 г, обсушить","2 ст. л. масла"]}],steps:["Очистить картофель и нарезать брусками толщиной 1,5 см. Залить водой и оставить на 30 минут, чтобы ушёл лишний крахмал. Промыть и тщательно обсушить.","В чистой миске смешать картофель с маслом, солью и манкой. Вставить решётки в обе корзины и выложить картофель в Зону 1.","В блендер сложить хлеб, чеснок, цедру, петрушку и приправы. Измельчить в мелкую крошку. Влить масло и пробить импульсами. Выложить крошку на треску и прижать обратной стороной ложки. Сбрызнуть корзину Зоны 2 маслом и аккуратно выложить рыбу.","Зона 1: AIR FRY, 200 °C, 26 минут. Зона 2: ROAST, 170 °C, 14 минут. Нажать SYNC и запустить диском.","Через 10 минут встряхнуть корзину Зоны 1, повторить через 15 и 20 минут. На 24-й минуте проверить готовность.","Подавать с соусом тартар и зелёным горошком."],source:Oe},{id:"salmon-asparagus",title:"Лосось с спаржей и пармезаном",titleOriginal:"Roasted Salmon & Parmesan Asparagus",category:"fish",summary:"Пятнадцать минут, две корзины, режим MATCH — и полноценный ужин ресторанного уровня.",servings:"2–4 порции",prepMinutes:15,totalMinutes:30,mode:"MATCH",zones:[{zone:1,title:"Лосось",fn:"ROAST",tempC:200,minutes:15,plate:!0},{zone:2,title:"Спаржа",fn:"ROAST",tempC:200,minutes:15,plate:!0}],ingredients:[{items:["3 ст. л. приправы для стейка","3 ст. л. коричневого сахара","3 филе лосося по 170 г","4 ст. л. оливкового масла","450 г спаржи, срезать жёсткие концы","30 г тёртого пармезана","Соль и перец по вкусу"]}],steps:["В маленькой миске смешать приправу для стейка с коричневым сахаром.","Смазать каждое филе 1 ст. л. масла и щедро обсыпать сахарной смесью. Отложить.","В миске перемешать спаржу с оставшейся 1 ст. л. масла, солью и перцем.","Вставить решётки в обе корзины. Филе выложить в Зону 1 кожей вниз, спаржу — в Зону 2.","Повернуть диск на ROAST, 200 °C, 15 минут. Нажать MATCH и запустить диском.","Через 8 минут вынуть корзину Зоны 2 и перевернуть спаржу силиконовыми щипцами. Вставить обратно.","Через 13 минут посыпать спаржу половиной пармезана и слегка встряхнуть корзину. Вставить обратно.","Готовое выложить на блюдо, посыпать спаржу оставшимся пармезаном и подавать."],source:Oe},{id:"falafel",title:"Фалафель с запечёнными овощами",titleOriginal:"Falafels & Roasted Vegetables",category:"veg",vegetarian:!0,summary:"Домашний фалафель из нута с хариссой и тёплый салат из тыквы, кабачка и перца.",servings:"3 порции",prepMinutes:10,totalMinutes:32,mode:"SYNC",zones:[{zone:1,title:"Овощи",fn:"ROAST",tempC:180,minutes:22,plate:!0,shakeAt:[10,18]},{zone:2,title:"Фалафель",fn:"AIR FRY",tempC:200,minutes:17,plate:!0}],ingredients:[{title:"Фалафель",items:["400 г консервированного нута, отцедить и промыть","2 ст. л. подсолнечного масла","1 маленькая красная луковица, разрезать на четвертинки","1 зубчик чеснока","5 г листьев петрушки","5 г кинзы","1 ч. л. молотого кумина","1 ч. л. молотого кориандра","1 ч. л. пасты харисса","20 г пшеничной муки","0,5 ч. л. соли","Масло-спрей"]},{title:"Овощи",items:["300 г мускатной тыквы, кубиками по 1,5 см","150 г кабачка, кусками по 2,5 см","4 маленьких сладких перца, разрезать пополам или на четвертинки","1 маленькая красная луковица, нарезать","2 ст. л. оливкового масла","1 ст. л. лимонного сока","1 зубчик чеснока, раздавить","1 ст. л. листьев свежего тимьяна","1 ч. л. кумина","Соль и перец по вкусу"]},{title:"Для подачи",items:["Питта","Листья салата","Майонез с копчёной паприкой"]}],steps:["Сложить все ингредиенты для фалафеля в блендер и пробить импульсами до почти однородной массы — текстура должна остаться слегка крупитчатой.","Мокрыми руками сформировать 6 шариков и выложить на лист пергамента чуть больше решётки. Убрать в холодильник на 20 минут, чтобы схватились.","Тем временем перемешать овощи с маслом, лимонным соком, чесноком, тимьяном и кумином, приправить. Вставить решётки в обе корзины, вынуть овощи из маринада (остаток маринада сохранить) и выложить в Зону 1.","Придерживая пергамент как гамак, аккуратно переложить фалафель на решётку в Зоне 2. Сбрызнуть маслом и вставить корзину.","Зона 1: ROAST, 180 °C, 22 минуты. Зона 2: AIR FRY, 200 °C, 17 минут. Нажать SYNC и запустить диском.","Через 10 минут перемешать овощи и смазать оставшимся маринадом. Повторить через 18 минут.","Подавать фалафель, разрезанный пополам, в питте с салатом и майонезом с копчёной паприкой, овощи — рядом."],source:Oe},{id:"stuffed-aubergine",title:"Баклажаны, фаршированные моцареллой",titleOriginal:"Stuffed Aubergine with Mozzarella",category:"veg",vegetarian:!0,summary:"Баклажаны запекаются, затем начиняются своей мякотью с черри, базиликом и моцареллой.",servings:"4 порции",prepMinutes:10,totalMinutes:40,mode:"MATCH",zones:[{zone:1,title:"Баклажаны",fn:"ROAST",tempC:190,minutes:20,plate:!0},{zone:2,title:"Баклажаны",fn:"ROAST",tempC:190,minutes:20,plate:!0}],ingredients:[{items:["2 крупных или 3 средних баклажана (около 800 г)","2 ст. л. оливкового масла","150 г томатного соуса с базиликом","200 г помидоров черри, разрезать на четвертинки","15 крупных листьев базилика, порубить","200 г моцареллы, нарезать кубиками","Соль и перец"]}],steps:["Разрезать баклажаны вдоль пополам, удалить плодоножку. Смазать мякоть оливковым маслом, посолить и поперчить.","Вставить решётку в каждую корзину, выложить баклажаны срезом вниз и вставить корзины в прибор.","Повернуть диск на ROAST, 190 °C, 20 минут, нажать MATCH и запустить диском.","Готовые баклажаны вынуть силиконовыми щипцами и ложкой аккуратно вынуть мякоть. В миске смешать мякоть с томатным соусом, черри, моцареллой и базиликом, посолить и поперчить. Начинить этой массой половинки баклажанов начинкой вверх.","Вставить корзины обратно. Выбрать AIR FRY, 200 °C, 10 минут, нажать MATCH и запустить диском.","Подавать горячими с салатом или пастой, поддевая силиконовой лопаткой."],source:Oe},{id:"banana-toffee-muffins",title:"Банановые маффины с карамелью",titleOriginal:"Banana & Toffee Muffins",category:"desserts",vegetarian:!0,summary:"Двенадцать нежных маффинов на спелых бананах, сразу в двух корзинах.",servings:"12 штук",prepMinutes:15,totalMinutes:35,mode:"MATCH",zones:[{zone:1,title:"Маффины",fn:"BAKE",tempC:160,minutes:15,plate:!0},{zone:2,title:"Маффины",fn:"BAKE",tempC:160,minutes:15,plate:!0}],ingredients:[{items:["200 г самоподнимающейся муки (или 200 г муки + 2 ч. л. разрыхлителя)","1 ч. л. смеси пряностей","0,5 ч. л. соли","2 спелых банана (около 320 г с кожурой)","200 г светло-коричневого сахара","100 г растительного масла","2 крупных яйца, взбить","1 ч. л. ванильной эссенции","50 г шоколадных капель","100 г густой карамели или варёной сгущёнки","12 банановых чипсов для украшения"]}],steps:["Просеять в миску муку, пряности и соль.","В большой миске размять очищенные бананы до гладкости. Вмешать сахар, масло, яйца и ваниль, взбить до однородности.","Постепенно ввести сухие ингредиенты, всё время перемешивая, затем добавить шоколадные капли.","Вставить решётки в обе корзины. Разложить по 6 двойных бумажных формочек в каждую и заполнить тестом на три четверти.","Зона 1: BAKE, 160 °C, 15 минут. Нажать MATCH и запустить диском.","Через 12 минут проверить готовность: деревянная шпажка из центра должна выходить сухой. Остудить маффины на решётке 5 минут.","Сверху на каждый маффин положить ложечку карамели и банановый чипс."],tips:["Силиконовые формочки для кексов подходят идеально."],source:Oe},{id:"pb-brownies",title:"Брауни с арахисовой пастой",titleOriginal:"Peanut Butter Chocolate Brownies",category:"desserts",vegetarian:!0,summary:"Печём прямо в корзине без решётки — влажный шоколадный брауни с арахисовыми разводами.",servings:"8–10 порций",prepMinutes:15,totalMinutes:55,mode:"SINGLE",zones:[{zone:1,title:"Брауни",fn:"BAKE",tempC:160,minutes:38,plate:!1}],ingredients:[{items:["80 г арахисовой пасты (разделить)","40 г сливочного масла","120 г тёмного шоколада (разделить)","175 г сахара","2 крупных яйца, взбить","60 г самоподнимающейся муки (или 60 г муки + 0,5 ч. л. разрыхлителя)","30 г какао-порошка"]}],steps:["Сбрызнуть корзину Зоны 1 маслом (решётку не ставить) и застелить дно пергаментом.","Отложить 40 г арахисовой пасты и 30 г шоколада. Остальной шоколад поломать и растопить в сотейнике вместе с арахисовой пастой и сливочным маслом, остудить.","В большой миске взбить сахар с яйцами до густой кремовой массы. Влить шоколадную смесь и перемешать.","Просеять муку с какао и аккуратно вмешать большой ложкой. Выложить тесто в подготовленную корзину. Растопить отложенную арахисовую пасту в микроволновке 40 секунд и полить сверху зигзагом.","Вставить корзину. Зона 1: BAKE, 160 °C, 35–40 минут. Запустить диском.","Через 30 минут проверить: середина должна быть мягкой на ощупь.","Растопить оставшийся шоколад в микроволновке по 20 секунд с перемешиванием и полить брауни. Остудить прямо в корзине.","Полностью остывший брауни вынуть за пергамент, как за гамак, и нарезать квадратами."],source:Oe},{id:"roasted-pears",title:"Запечённые груши с песочным печеньем",titleOriginal:"Roasted Pears & Shortbread",category:"desserts",vegetarian:!0,summary:"Груши томятся в медово-цитрусовом сиропе в одной корзине, песочное печенье печётся в другой.",servings:"6 порций",prepMinutes:20,totalMinutes:60,mode:"DUAL",zones:[{zone:1,title:"Груши в сиропе",fn:"ROAST",tempC:190,minutes:40,plate:!1},{zone:2,title:"Песочное печенье",fn:"BAKE",tempC:150,minutes:35,plate:!1}],ingredients:[{title:"Печенье",items:["65 г сливочного масла комнатной температуры","30 г светло-коричневого сахара","75 г пшеничной муки","15 г кукурузного крахмала","Щепотка мелкой морской соли"]},{title:"Груши",items:["6 груш конференс (около 150 г каждая)","2 небольших лимона","1 небольшой апельсин","80 мл мёда","15 г сливочного масла","2 ст. л. воды","Крем-фреш для подачи"]}],steps:["Взбить масло с сахаром и солью около минуты. Смешать муку с крахмалом, добавить к масляной массе и замесить тесто. Охладить.","Выложить тесто на пергамент и придать форму прямоугольника 16 × 12 см. Убрать на противне в холодильник на 20–30 минут до плотности.","В миску выжать 1 лимон и долить холодной воды столько, чтобы покрыть груши. Очистить груши, сразу опуская в воду. С оставшегося лимона и апельсина снять овощечисткой 3–4 полоски цедры. Выжать сок обоих в сотейник, добавить цедру, мёд, масло и 2 ст. л. воды. Нагреть, чтобы масло разошлось.","Плотное тесто наколоть вилкой и разрезать на 6 квадратов.","Вынуть решётки из обеих корзин. Груши уложить лёжа в корзину Зоны 1 и залить медово-цитрусовой смесью. Печенье выложить в корзину Зоны 2, оставив место между кусочками.","Зона 1: ROAST, 190 °C, 40 минут. Зона 2: BAKE, 150 °C, 35 минут. Запустить диском.","Груши 2–3 раза за время готовки аккуратно перевернуть и полить сиропом. Проверить кончиком ножа: если жёстче, чем хочется, запекать дольше.","Печенье снять силиконовой лопаткой и остудить на решётке. Сироп при желании уварить в сотейнике до нужной густоты. Подавать груши с печеньем и крем-фрешем."],source:Oe},{id:"hunters-chicken",title:"Куриная грудка в беконе с сыром и картофель фри",titleOriginal:"Hunters BBQ Chicken & Chips",category:"chicken",summary:"Курица, завёрнутая в бекон, под расплавленным чеддером и соусом барбекю, с домашним картофелем.",servings:"4 порции",prepMinutes:10,totalMinutes:35,mode:"SYNC",zones:[{zone:1,title:"Курица в беконе",fn:"ROAST",tempC:180,minutes:25,plate:!0},{zone:2,title:"Картофель",fn:"AIR FRY",tempC:200,minutes:25,plate:!0,shakeAt:[15,20]}],ingredients:[{items:["600 г крахмалистого картофеля, нарезать брусками по 1 см","3 ст. л. масла","4 полоски копчёного бекона","4 куриные грудки по 170 г","50 г тёртого чеддера","4 ст. л. соуса барбекю","Морская соль"]}],steps:["Замочить нарезанный картофель в холодной воде на 30 минут, чтобы ушёл крахмал. Хорошо отцедить и обсушить бумажным полотенцем досуха.","Куриные грудки подвернуть в аккуратную форму и обернуть беконом, закрепив зубочисткой.","Перемешать картофель с маслом — минимум половина столовой ложки, для более хрустящего результата до 3 ложек.","Вставить решётки в обе корзины. Курицу — в Зону 1, картофель — в Зону 2.","Зона 1: ROAST, 180 °C, 25 минут. Зона 2: AIR FRY, 200 °C, 25 минут. Нажать SYNC и запустить диском.","Когда в Зоне 1 останется 10 минут, вынуть корзину и посыпать курицу сыром. Вставить обратно.","Когда в Зоне 2 останется 10 минут, встряхнуть корзину 10 секунд. Повторить, когда останется 5 минут. Посолить перед подачей.","Проверить курицу: внутри не меньше 75 °C. Подавать, полив соусом барбекю, вместе с картофелем."],source:mt},{id:"italian-hotdogs",title:"Острые итальянские хот-доги с перцем и луком",titleOriginal:"Spicy Italian Hot Dogs with Peppers & Onions",category:"meat",summary:"Колбаски и сладкий перец с луком готовятся параллельно — ужин за 16 минут.",servings:"5 порций",prepMinutes:10,totalMinutes:26,mode:"MATCH",zones:[{zone:1,title:"Колбаски",fn:"AIR FRY",tempC:200,minutes:16,plate:!0,shakeAt:[5,9]},{zone:2,title:"Перец с луком",fn:"AIR FRY",tempC:200,minutes:16,plate:!0,shakeAt:[5,9]}],ingredients:[{items:["1 небольшая луковица, тонко нарезать","1 красный болгарский перец, тонко нарезать","1 зелёный болгарский перец, тонко нарезать","0,5 ч. л. соли","0,25 ч. л. молотого чёрного перца","1 ст. л. оливкового масла","5 сырых острых итальянских колбасок","5 булочек для хот-дога"]}],steps:["В миске перемешать лук, перец, соль, чёрный перец и оливковое масло.","Вставить решётки в обе корзины. Колбаски — в Зону 1, перец с луком — в Зону 2.","Зона 1: AIR FRY, 200 °C, 16 минут. Нажать MATCH и запустить диском.","Когда останется 11 минут, вынуть корзину и встряхнуть 10 секунд. Повторить, когда останется 7 минут.","Разложить перец с луком по булочкам, сверху уложить колбаски и подавать."],source:mt},{id:"sweet-potato-hash",title:"Батат с мясным фаршем и специями",titleOriginal:"Sweet Potato Sausage Hash",category:"meat",summary:"Сытный завтрак или ужин: сладкий картофель с чесноком и пряный фарш с корицей и шалфеем.",servings:"4 порции",prepMinutes:20,totalMinutes:55,mode:"DUAL",zones:[{zone:1,title:"Батат",fn:"AIR FRY",tempC:200,minutes:25,plate:!0,shakeAt:[13]},{zone:2,title:"Колбасный фарш",fn:"ROAST",tempC:200,minutes:35,plate:!1,shakeAt:[18]}],ingredients:[{items:["675 г батата, кубиками по 1,5 см","2 ст. л. рапсового масла","1 ст. л. измельчённого чеснока","1 ч. л. морской соли и ещё немного по вкусу","Молотый чёрный перец по вкусу","3 ч. л. сушёного шалфея (разделить)","450 г колбасного фарша","0,5 крупной луковицы, кубиком","4 крупных яйца, пашот или жареные (по желанию)","1 ч. л. молотой корицы","1 ч. л. молотого мускатного ореха","2 ч. л. порошка чили"]}],steps:["В миске перемешать батат с маслом, чесноком, солью и перцем.","Вставить решётку в Зону 1 и выложить батат. Фарш распределить по корзине Зоны 2 без решётки. Вставить обе корзины.","Зона 1: AIR FRY, 200 °C, 25 минут. Зона 2: ROAST, 200 °C, 35 минут. Запустить диском.","Когда в Зоне 2 останется 17 минут, вынуть корзину и размешать фарш деревянной ложкой, добавить лук и перемешать. Вставить обратно.","Когда в Зоне 1 останется 12 минут, встряхнуть корзину 10 секунд и вмешать половину шалфея. Вставить обратно.","Готовый батат добавить к фаршу. Всыпать корицу, мускатный орех, оставшийся шалфей, чили и 1 ч. л. соли, тщательно перемешать.","Подавать сразу, при желании положив сверху яйцо пашот или яичницу."],source:mt},{id:"steak-bites",title:"Кусочки стейка с грибами",titleOriginal:"Steak Bites with Mushrooms",category:"meat",summary:"Маринованный рибай кубиками и шампиньоны — 12 минут до готовности.",servings:"4 порции",prepMinutes:15,totalMinutes:27,mode:"SYNC",zones:[{zone:1,title:"Стейк кубиками",fn:"AIR FRY",tempC:200,minutes:12,plate:!0,shakeAt:[7]},{zone:2,title:"Грибы",fn:"AIR FRY",tempC:200,minutes:9,plate:!0,shakeAt:[4]}],ingredients:[{items:["650 г стейка рибай","4 ст. л. оливкового масла","1 ч. л. соевого соуса","2 зубчика чеснока, раздавить","1 ч. л. сушёных прованских трав","0,5 ч. л. соли","0,25 ч. л. перца","400 г каштановых шампиньонов","Свежая рубленая петрушка для подачи"]}],steps:["Срезать со стейка лишний жир и нарезать мясо кубиками по 2,5 см, сложить в большую миску. Грибы протереть влажным бумажным полотенцем и сложить в отдельную миску, крупные разрезать пополам.","В маленькой миске смешать оливковое масло, соевый соус, чеснок и травы. Разделить смесь между мясом и грибами и оставить мариноваться 20 минут.","Вставить решётки в обе корзины. Мясо — в Зону 1, грибы — в Зону 2.","Обе зоны: AIR FRY, 200 °C. Зона 1 — 12 минут, Зона 2 — 9 минут. Нажать SYNC и запустить диском.","Когда в обеих зонах останется по 5 минут, встряхнуть обе корзины.","Проверить прожарку мяса, вынуть силиконовыми щипцами, посыпать петрушкой и подавать с салатом."],source:mt},{id:"haddock-croquettes",title:"Рыбные крокеты из пикши",titleOriginal:"Haddock Croquettes",category:"fish",summary:"Хрустящие снаружи, нежные внутри — 10 минут в обеих корзинах сразу.",servings:"4 порции",prepMinutes:30,totalMinutes:40,mode:"MATCH",zones:[{zone:1,title:"Крокеты",fn:"AIR FRY",tempC:200,minutes:10,plate:!0},{zone:2,title:"Крокеты",fn:"AIR FRY",tempC:200,minutes:10,plate:!0}],ingredients:[{items:["75 г свежих хлебных крошек","2 ч. л. хереса (можно заменить сливками)","500 г сырого филе пикши, разобрать на хлопья","3 яйца","1 пучок свежей петрушки, мелко нарубить","1,5 ч. л. сушёного кориандра","0,5 ч. л. соли","0,25 ч. л. белого перца","Цедра 1 лимона","100 г пшеничной муки","150 г сухих панировочных сухарей","Рапсовое масло для сбрызгивания"]}],steps:["В миске соединить свежие хлебные крошки, рыбу и херес. Хорошо размять. Взбить одно яйцо и добавить вместе с петрушкой, кориандром, перцем, солью и цедрой. Тщательно перемешать.","Приготовить три плошки: с мукой, с сухарями и с двумя оставшимися взбитыми яйцами. Противень застелить пергаментом.","Обваляв руки в муке, сформировать крокеты длиной 5–7 см. Обвалять каждый сначала в муке, затем в яйце, затем в сухарях и выложить на противень.","Вставить решётки в обе корзины и сбрызнуть маслом. Выложить крокеты и сбрызнуть их маслом.","AIR FRY, 200 °C, 10 минут. Нажать MATCH и запустить диском.","Готовые крокеты переложить силиконовыми щипцами на блюдо и сразу подавать с салатом, соусом тартар и лимоном."],source:mt},{id:"fish-fingers",title:"Домашние рыбные палочки с молодым картофелем",titleOriginal:"Homemade Fish Fingers with Lemon and Thyme New Potatoes",category:"fish",summary:"Честные рыбные палочки из трески — без лишней панировки из магазина.",servings:"4 порции",prepMinutes:15,totalMinutes:35,mode:"SYNC",zones:[{zone:1,title:"Рыбные палочки",fn:"AIR FRY",tempC:210,minutes:15,plate:!0,shakeAt:[5]},{zone:2,title:"Молодой картофель",fn:"ROAST",tempC:180,minutes:20,plate:!0,shakeAt:[10]}],ingredients:[{title:"Рыба",items:["400 г толстого филе трески","50 г пшеничной муки","Цедра 1 лимона (разделить)","Соль и перец","1 крупное яйцо, взбить","50 г сухих панировочных сухарей","Масло-спрей"]},{title:"Картофель",items:["500 г молодого картофеля с кожурой","2 ст. л. оливкового масла","1 ст. л. лимонного сока","1 ст. л. листьев свежего тимьяна или 1 ч. л. сушёного","1 зубчик чеснока, раздавить","Морская соль и перец","Долька лимона и петрушка для подачи"]}],steps:["Снять с филе кожу. Нарезать треску брусками примерно 2,5 × 10 см.","Приготовить три плошки: мука с половиной цедры и приправами, взбитое яйцо, сухари.","Обмакнуть бруски рыбы сначала в муку, затем в яйцо, затем в сухари. Вставить решётки в обе корзины, сбрызнуть решётку Зоны 1 маслом, выложить палочки и сбрызнуть сверху.","Крупный картофель разрезать пополам. В миске смешать оливковое масло, лимонный сок, оставшуюся цедру, тимьян, чеснок и приправы. Добавить картофель и тщательно перемешать. Выложить в корзину Зоны 2 и вставить обе корзины.","Зона 1: AIR FRY, 210 °C, 15 минут. Зона 2: ROAST, 180 °C, 20 минут. Нажать SYNC и запустить диском.","Когда в обеих зонах останется по 10 минут, перевернуть рыбные палочки и встряхнуть картофель.","Подавать сразу с зелёным горошком и соусом тартар, украсив лимоном и петрушкой."],source:mt},{id:"stuffed-peppers",title:"Фаршированные перцы с рисом и песто",titleOriginal:"Stuffed Peppers",category:"veg",vegetarian:!0,summary:"Быстрый вегетарианский ужин на готовом рисе — 22 минуты и обе корзины заняты.",servings:"4 порции",prepMinutes:10,totalMinutes:32,mode:"MATCH",zones:[{zone:1,title:"Перцы",fn:"ROAST",tempC:180,minutes:22,plate:!1},{zone:2,title:"Перцы",fn:"ROAST",tempC:180,minutes:22,plate:!1}],ingredients:[{items:["4 болгарских перца","2 пакета готового овощного риса по 250 г","4 вяленых помидора в масле, нарубить (масло сохранить)","2 ст. л. песто","Соль и перец","75 г тёртого чеддера (разделить)"]}],steps:["Разрезать перцы пополам, удалить семена и белые перегородки.","В миске размять рис, если он слипся, смешать с вялеными помидорами, песто и половиной сыра. Приправить по вкусу.","Наполнить половинки перцев рисовой смесью.","Разложить перцы по обеим корзинам без решёток. Сбрызнуть сверху маслом от вяленых помидоров и вставить корзины.","Зона 1: ROAST, 180 °C, 22 минуты. Нажать MATCH и запустить диском.","Когда в обеих зонах останется 7 минут, вынуть корзины и посыпать перцы оставшимся сыром. Вставить обратно. Проверить на 22-й минуте, при необходимости добавить 3 минуты.","Подавать сразу с томатным салатом или фри из батата."],source:mt},{id:"halloumi-fries",title:"Фри из халуми и кукуруза с чили-маслом",titleOriginal:"Halloumi Fries & Chilli Corn on the Cob",category:"snacks",vegetarian:!0,summary:"Хрустящий солоноватый халуми и сладкая кукуруза под острым медовым маслом.",servings:"4 порции",prepMinutes:20,totalMinutes:38,mode:"SYNC",zones:[{zone:1,title:"Фри из халуми",fn:"AIR FRY",tempC:200,minutes:18,plate:!0,shakeAt:[8,12]},{zone:2,title:"Кукуруза",fn:"ROAST",tempC:180,minutes:15,plate:!0}],ingredients:[{title:"Халуми",items:["2 упаковки халуми по 225 г","75 г пшеничной муки","Соль и перец по вкусу","1 лимон","150 г натурального греческого йогурта","2 ст. л. рубленой кинзы","Масло-спрей"]},{title:"Кукуруза",items:["50 г мягкого сливочного масла","2 ч. л. томатного кетчупа","1 ч. л. мёда","0,5 ч. л. розовой хариссы","4 небольших початка кукурузы"]}],steps:["Отцедить халуми и обсушить. Нарезать толстыми брусками.","В плоской миске смешать муку с солью и перцем. Обвалять бруски халуми в муке тонким слоем.","Вставить решётки в обе корзины. Щедро сбрызнуть корзину Зоны 1 маслом, выложить халуми и сбрызнуть сверху. Вставить корзину.","Сделать чили-масло: взбить до гладкости сливочное масло, кетчуп, мёд и хариссу. Кисточкой смазать каждый початок. Остаток масла завернуть в плёнку колбаской и убрать в холод. Кукурузу выложить на решётку в Зоне 2 и вставить корзину.","Зона 1: AIR FRY, 200 °C, 18 минут. Зона 2: ROAST, 180 °C, 15 минут. Нажать SYNC и запустить диском.","Когда в Зоне 1 останется 10 минут, перемешать халуми и повернуть кукурузу. Повторить, когда останется 6 минут.","Охлаждённое чили-масло нарезать на 4 части и положить на кукурузу. Халуми подавать с греческим йогуртом, смешанным с кинзой."],tips:["Хочешь поострее — добавь в муку по 1 ч. л. сумаха и заатара."],source:mt},{id:"sweet-sour-tofu",title:"Тофу в кисло-сладком соусе с овощами",titleOriginal:"Sweet & Sour Tofu & Asian-Style Vegetables",category:"veg",vegetarian:!0,summary:"Тофу в кукурузном крахмале становится хрустящим, а замороженная овощная смесь — идеальным гарниром.",servings:"4 порции",prepMinutes:15,totalMinutes:35,mode:"SYNC",zones:[{zone:1,title:"Тофу",fn:"AIR FRY",tempC:200,minutes:20,plate:!0,shakeAt:[5,13]},{zone:2,title:"Овощи",fn:"ROAST",tempC:200,minutes:15,plate:!0,shakeAt:[10]}],ingredients:[{items:["400 г плотного тофу, обсушить и нарезать кубиками по 2,5 см","2 ст. л. кукурузного крахмала","650 г замороженной овощной смеси для вока","1 ст. л. растительного масла","120 г кисло-сладкого соуса","1 ч. л. чесночного порошка","Морская соль по вкусу","Молотый чёрный перец по вкусу"]}],steps:["В миске обвалять тофу в кукурузном крахмале.","Вставить решётки в обе корзины. Тофу — в Зону 1, замороженные овощи с маслом — в Зону 2.","Зона 1: AIR FRY, 200 °C, 20 минут. Зона 2: ROAST, 200 °C, 15 минут. Нажать SYNC и запустить диском.","Когда в Зоне 1 останется 15 минут, встряхнуть корзину 10 секунд. Повторить, когда останется 7 минут.","Когда в Зоне 2 останется 5 минут, встряхнуть корзину 10 секунд.","Готовый тофу переложить в миску и перемешать с кисло-сладким соусом. Овощи в другой миске приправить чесночным порошком, солью и перцем. Подавать сразу."],tips:["Кисло-сладкий соус можно заменить любым любимым готовым соусом."],source:mt},{id:"cauliflower-bites",title:"Цветная капуста в панировке с печёным бататом",titleOriginal:"Cauliflower Bites & Baked Sweet Potatoes",category:"veg",vegetarian:!0,summary:"Соцветия в хрустящем панко под острым соусом плюс печёный батат и салат ранч.",servings:"4 порции",prepMinutes:20,totalMinutes:50,mode:"SYNC",zones:[{zone:1,title:"Цветная капуста",fn:"AIR FRY",tempC:180,minutes:25,plate:!0,shakeAt:[10]},{zone:2,title:"Батат целиком",fn:"AIR FRY",tempC:200,minutes:30,plate:!0,shakeAt:[15]}],ingredients:[{title:"Цветная капуста",items:["400 г цветной капусты","150 г пшеничной муки","1 ч. л. лукового порошка","1 ч. л. чесночного порошка","1 ч. л. молотого кумина","1 ч. л. паприки","Соль и свежемолотый перец по вкусу","300 мл молока","100 г панировочных сухарей панко","30 мл подсолнечного масла","90 мл острого соуса буффало"]},{title:"Батат",items:["4 батата по 175 г","1 ст. л. оливкового масла","1 ч. л. морской соли хлопьями"]},{title:"Салат ранч",items:["120 г майонеза","60 г заправки ранч","1 ст. л. яблочного уксуса","1 ст. л. семян мака","Соль и перец по вкусу","200 г капусты, тонко нашинковать","1 красное яблоко, очистить от сердцевины и тонко нарезать","1 стебель сельдерея, тонко нарезать","1 ст. л. рубленой петрушки","1 ст. л. рубленого шнитт-лука"]}],steps:["Разобрать капусту на соцветия по 2,5 см.","В миске смешать муку, луковый и чесночный порошок, кумин и паприку, приправить. Постепенно влить молоко, взбивая до гладкого жидкого теста.","В другую миску насыпать панко.","Обмакнуть соцветия в тесто, затем обвалять в панко.","Батат несколько раз проколоть вилкой, натереть кожуру оливковым маслом и посыпать морской солью.","Вставить решётки в обе корзины. Капусту — в Зону 1, батат — в Зону 2. Зона 1: AIR FRY, 180 °C, 25 минут. Зона 2: AIR FRY, 200 °C, 30 минут. Нажать SYNC и запустить диском.","Смешать подсолнечное масло с соусом буффало. Когда в Зоне 1 останется 15 минут, вынуть корзину и смазать капусту соусом, одновременно перевернув батат. Вставить корзины обратно.","В большой миске взбить майонез, заправку ранч, уксус, мак и приправы. Добавить капусту, яблоко, сельдерей и зелень, перемешать.","Подавать соцветия с бататом и салатом."],source:mt}],Yn=h=>({label:"Официальный сайт Ninja Test Kitchen (отмечен для AF400)",url:h}),ac=[{id:"site-pumpkin",title:"Пряная тыква с корицей и карамельной корочкой",titleOriginal:"Sweet Roasted Pumpkin",category:"veg",vegetarian:!0,summary:"Тыква с корицей, гвоздикой и мускатным орехом карамелизуется до золотистой корочки. Обе корзины сразу — режим MATCH.",servings:"4 порции",prepMinutes:10,totalMinutes:15,mode:"MATCH",zones:[{zone:1,title:"Тыква",fn:"AIR FRY",tempC:180,minutes:15,plate:!0,shakeAt:[7]},{zone:2,title:"Тыква",fn:"AIR FRY",tempC:180,minutes:15,plate:!0,shakeAt:[7]}],ingredients:[{items:["1 небольшая тыква (500 г), очистить от семян и кожуры, нарезать дольками по 2,5 см","2 ст. л. оливкового масла","2 ч. л. молотой корицы","0,25 ч. л. молотой гвоздики","0,25 ч. л. молотого мускатного ореха","4 ст. л. коричневого сахара или кленового сахара","2 ч. л. морской соли хлопьями"]}],steps:["В большой миске смешать все ингредиенты, кроме тыквы, до однородности.","Добавить дольки тыквы и перемешать, чтобы они полностью покрылись пряной смесью.","Вставить решётки в обе корзины. Разделить тыкву поровну между корзинами и вставить их в прибор.","Зона 1: AIR FRY, 180 °C, 15 минут. Нажать MATCH и запустить диском.","Через 7 минут встряхнуть обе корзины. На 10-й минуте проверить готовность.","Тыква готова, когда стала мягкой и золотистой. Подавать сразу."],tips:["Для варианта без сахара замени коричневый сахар на эритрит."],source:Yn("https://www.sharkninja.co.uk/sweet-roasted-pumpkin/REC7848EU.html")},{id:"site-broccoli-tahini",title:"Брокколи с кунжутно-тахинной заправкой",titleOriginal:"Airfryer Tenderstem Broccoli with a Sesame Tahini Dressing",category:"veg",vegetarian:!0,summary:"Хрустящая снаружи и нежная внутри брокколи под яркой заправкой из тахини и лимона. Семь минут на гарнир.",servings:"2 порции",prepMinutes:5,totalMinutes:7,mode:"SINGLE",zones:[{zone:1,title:"Брокколи",fn:"AIR FRY",tempC:200,minutes:7,plate:!0}],ingredients:[{title:"Брокколи",items:["200 г брокколи (лучше стеблевой)","Оливковое масло, можно чесночное"]},{title:"Заправка",items:["2 ст. л. тахини","1 ст. л. кунжутного масла","Сок 1 лимона","0,5 ст. л. соевого соуса тамари","Щепотка соли","1 ст. л. тёплой воды"]},{title:"По желанию",items:["Чёрный кунжут","Свежий красный чили или хлопья чили"]}],steps:["Сбрызнуть или смазать брокколи оливковым маслом.","Выложить на решётку в корзину.","AIR FRY, 200 °C, 7 минут.","Пока готовится, сделать заправку: смешать тахини, кунжутное масло, тамари, лимонный сок, соль и столовую ложку тёплой воды до загустения.","Полить готовую брокколи заправкой.","По желанию посыпать чёрным кунжутом и рубленым чили."],source:Yn("https://www.sharkninja.co.uk/airfryer-tenderstem-broccoli-with-a-sesame-tahini-dressing/REC8574EU.html")},{id:"site-seabass",title:"Сибас с сальсой верде, фенхелем и томатами",titleOriginal:"Sea Bass With Salsa Verde, Fennel & Tomatoes",category:"fish",summary:"Праздничное блюдо: нежный сибас с лимоном, запечённый фенхель с томатами на ветке и итальянский зелёный соус.",servings:"2 порции",prepMinutes:15,totalMinutes:15,mode:"SYNC",zones:[{zone:1,title:"Фенхель с томатами",fn:"AIR FRY",tempC:180,minutes:15,plate:!0,shakeAt:[5,10]},{zone:2,title:"Сибас",fn:"ROAST",tempC:200,minutes:9,plate:!0}],ingredients:[{title:"Основное",items:["2 небольших кочана фенхеля, нарезать дольками по 2 см","1 ветка помидоров черри, разделить на две части","1 ст. л. оливкового масла","2 филе сибаса по 90 г","1 лимон, тонко нарезать","Морская соль и свежемолотый чёрный перец"]},{title:"Сальса верде",items:["10 г листьев петрушки","10 г листьев базилика","5 г листьев мяты","2 зубчика чеснока","1 ч. л. каперсов, отцедить","2 филе анчоуса","5 ст. л. оливкового масла extra virgin","2 ст. л. лимонного сока"]}],steps:["Сложить все ингредиенты для сальсы верде в блендер и пробить импульсами до однородной гладкой массы.","В большой миске перемешать фенхель, помидоры, оливковое масло и 1 ст. л. сальсы верде.","Вставить решётки в обе корзины. Фенхель с томатами выложить в Зону 1 и вставить корзину.","В корзину Зоны 2 выложить сибаса кожей вниз, сверху разложить ломтики лимона, посолить и поперчить. Вставить корзину.","Зона 1: AIR FRY, 180 °C, 15 минут. Зона 2: ROAST, 200 °C, 9 минут. Нажать SYNC и запустить диском.","Через 5 минут вынуть корзину Зоны 1 и встряхнуть фенхель с томатами. Повторить через 10 минут.","Подавать сибаса сразу, с фенхелем, томатами и сальсой верде."],source:Yn("https://www.sharkninja.co.uk/sea-bass-with-salsa-verde-fennel-tomatoes/REC8919EU.html")},{id:"site-popcorn",title:"Попкорн с солёной карамелью",titleOriginal:"Salted Caramel Popcorn",category:"snacks",vegetarian:!0,summary:"Да, аэрогриль умеет и попкорн. Восемь минут — и к вечернему фильму готова целая миска.",servings:"4 порции",prepMinutes:2,totalMinutes:8,mode:"MATCH",zones:[{zone:1,title:"Кукуруза для попкорна",fn:"AIR FRY",tempC:200,minutes:6,plate:!0},{zone:2,title:"Кукуруза для попкорна",fn:"AIR FRY",tempC:200,minutes:6,plate:!0}],ingredients:[{items:["100 г кукурузы для попкорна","1–2 ст. л. соуса «солёная карамель»"]}],steps:["Вставить решётки в обе корзины и насыпать кукурузу ровным слоем.","Зона 1: AIR FRY, 200 °C, 6 минут. Нажать MATCH и запустить диском.","Обязательно дождаться, пока зёрна перестанут лопаться, и только потом открывать корзину.","Вмешать карамельный соус в горячий попкорн, чтобы он равномерно покрыл зёрна.","Поставить ещё раз: AIR FRY, 200 °C, 2 минуты. Проверить через полторы минуты, достаточно ли карамелизовалось.","Выбросить нераскрывшиеся зёрна, дать попкорну остыть и подавать."],tips:["Без карамели получится полезный вариант — просто присоли."],source:Yn("https://www.sharkninja.co.uk/salted-caramel-popcorn/REC8934EU.html")},{id:"site-fruit-leather",title:"Клубничная пастила",titleOriginal:"Strawberry Fruit Leather",category:"desserts",vegetarian:!0,summary:"Натуральная пастила из трёх ингредиентов. Отличный способ спасти перезревшую клубнику.",servings:"6 рулетиков",prepMinutes:15,totalMinutes:480,mode:"MATCH",zones:[{zone:1,title:"Клубничное пюре",fn:"DEHYDRATE",tempC:60,minutes:480,plate:!0},{zone:2,title:"Клубничное пюре",fn:"DEHYDRATE",tempC:60,minutes:480,plate:!0}],ingredients:[{items:["Масло-спрей для смазывания","500 г клубники без плодоножек","3 ст. л. мёда","2 ст. л. лимонного сока"]}],steps:["Смазать нижние стенки обеих корзин маслом, чтобы пергамент прилип. Вставить решётки и застелить каждую корзину пергаментом так, чтобы он заходил на стенки. Плотно прижать бумагу.","Сложить клубнику в блендер вместе с мёдом и лимонным соком. Пробить до гладкого пюре.","Разлить пюре поровну по обеим корзинам поверх пергамента. Наклонить корзины, чтобы слой получился ровным.","Зона 1: DEHYDRATE, 60 °C, 8 часов. Нажать MATCH и запустить диском.","Проверить: пастила должна быть упругой на ощупь. Если нужно — добавить ещё 2 часа при тех же настройках.","Дать пастиле полностью остыть прямо в приборе.","Вынуть вместе с пергаментом, нарезать каждый лист вдоль на 3 полоски, обрезать лишнюю бумагу и скатать в рулетики. Хранить в герметичном контейнере."],source:Yn("https://www.sharkninja.co.uk/strawberry-fruit-leather/REC8938EU.html")}],fe={label:"Официальные таблицы приготовления Ninja AF400EU"},Gs={label:"Официальная таблица SYNC Ninja AF400EU"},cc=[{id:"basic-wings",title:"Куриные крылышки",category:"chicken",summary:"Хрустящие снаружи, сочные внутри. Самое популярное блюдо в аэрогриле.",servings:"4 порции",prepMinutes:5,totalMinutes:30,mode:"SINGLE",zones:[{zone:1,title:"Крылышки",fn:"AIR FRY",tempC:200,minutes:28,plate:!0,shakeAt:[10,20]}],ingredients:[{items:["1 кг куриных крылышек","1–2 ст. л. растительного масла","Соль, перец, паприка, чесночный порошок по вкусу"]}],steps:["Обсушить крылышки бумажным полотенцем — это главный секрет хрустящей кожи.","Смазать маслом и обвалять в специях.","Вставить решётку, выложить крылышки одним слоем, не наваливая.","AIR FRY, 200 °C, 27–30 минут.","Встряхнуть на 10-й и 20-й минуте.","Готовы, когда кожа золотистая, а внутри не меньше 75 °C."],tips:["Нужно вдвое больше? Загрузи обе корзины и нажми MATCH.","Соус добавляй уже после готовки, иначе он подгорит."],source:fe},{id:"basic-chicken-breast",title:"Куриные грудки",category:"chicken",summary:"База для салатов, пасты и обедов на работу. 16 минут — и мясо остаётся сочным.",servings:"4 порции",prepMinutes:5,totalMinutes:16,mode:"SINGLE",zones:[{zone:1,title:"Куриные грудки",fn:"AIR FRY",tempC:200,minutes:16,plate:!0,shakeAt:[8]}],ingredients:[{items:["4 куриные грудки (около 600 г)","Растительное масло для смазывания","Соль, перец, любимые специи"]}],steps:["Смазать грудки маслом и приправить.","Вставить решётку и выложить грудки в один слой.","AIR FRY, 200 °C, 15–16 минут.","Перевернуть в середине приготовления.","Проверить термометром: 75 °C внутри. Дать мясу отдохнуть 5 минут перед нарезкой."],source:fe},{id:"basic-chicken-thighs",title:"Куриные бёдра",category:"chicken",summary:"Самая благодарная часть курицы: сочная и почти невозможно пересушить.",servings:"4–6 порций",prepMinutes:5,totalMinutes:22,mode:"SINGLE",zones:[{zone:1,title:"Бёдра на кости",fn:"AIR FRY",tempC:200,minutes:21,plate:!0,shakeAt:[11]}],ingredients:[{items:["6 куриных бёдер на кости с кожей (по 125–150 г)","Растительное масло","Соль, перец, специи по вкусу"]}],steps:["Обсушить бёдра, смазать маслом и приправить.","Вставить решётку, выложить кожей вверх.","AIR FRY, 200 °C: на кости с кожей 19–22 минуты, без кости и кожи 15–16 минут.","Перевернуть в середине.","Готово при 75 °C внутри."],source:fe},{id:"basic-whole-chicken",title:"Курица целиком",category:"chicken",summary:"Полноценная запечённая курица без духовки — 50 минут в режиме ROAST.",servings:"4 порции",prepMinutes:10,totalMinutes:50,mode:"SINGLE",zones:[{zone:1,title:"Курица целиком",fn:"ROAST",tempC:170,minutes:50,plate:!0}],ingredients:[{items:["Курица целиком около 1,4 кг","Растительное масло","Соль, перец, специи","По желанию: лимон, чеснок, тимьян внутрь"]}],steps:["Связать ножки, чтобы курица держала форму.","Смазать маслом, посолить и поперчить снаружи и внутри.","Вставить решётку и положить курицу грудкой вверх.","ROAST, 170 °C, 50 минут.","Проверить термометром в самой толстой части бедра: 75 °C.","Дать отдохнуть 10 минут перед нарезкой."],tips:["В каждую корзину помещается птица до 2 кг — крупной курице тоже хватит места."],source:fe},{id:"basic-homemade-fries",title:"Домашний картофель фри",category:"basics",vegetarian:!0,summary:"Настоящий фри из свежей картошки — с минимумом масла и без фритюрницы.",servings:"2–3 порции",prepMinutes:35,totalMinutes:20,mode:"SINGLE",zones:[{zone:1,title:"Картофель фри",fn:"AIR FRY",tempC:200,minutes:18,plate:!0,shakeAt:[8,13]}],ingredients:[{items:["500 г крахмалистого картофеля","0,5–3 ст. л. растительного масла","Соль по вкусу"]}],steps:["Нарезать картофель брусками: тонкими около 1 см или толстыми около 2 см.","Замочить в холодной воде на 30 минут, чтобы вымыть крахмал.","Слить воду и очень тщательно обсушить — чем суше картошка, тем лучше корочка.","Перемешать с маслом. Чем больше масла, тем хрустящее результат.","Вставить решётку, выложить и запустить AIR FRY, 200 °C: тонкий фри 16–18 минут, толстый 18–20 минут.","Встряхнуть 2–3 раза за время готовки. Солить уже готовый."],tips:["Готовишь на всю семью — раздели картошку по двум корзинам и нажми MATCH."],source:fe},{id:"basic-frozen-fries",title:"Замороженный картофель фри",category:"basics",vegetarian:!0,summary:"Из морозилки до хруста за 14 минут в режиме MAX CRISP.",servings:"2–3 порции",prepMinutes:1,totalMinutes:14,mode:"SINGLE",zones:[{zone:1,title:"Картофель фри",fn:"MAX CRISP",minutes:14,plate:!0,shakeAt:[7]}],ingredients:[{items:["500 г замороженного картофеля фри","Соль по вкусу"]}],steps:["Высыпать замороженный картофель на решётку, не размораживая и без масла.","MAX CRISP, 14 минут. Температура фиксированная — 240 °C, менять её не нужно.","Встряхнуть в середине приготовления.","Посолить сразу после готовки."],tips:["Другой вид фри — свои цифры: рифлёный 210 °C 18–20 мин, дольки 190 °C 20 мин, из батата 180 °C 22–24 мин (режим AIR FRY)."],source:fe},{id:"basic-frozen-nuggets",title:"Наггетсы и рыбные палочки из морозилки",category:"basics",summary:"Быстрый ужин для детей: 10 минут без разморозки и без капли масла.",servings:"2–4 порции",prepMinutes:1,totalMinutes:10,mode:"SINGLE",zones:[{zone:1,title:"Наггетсы",fn:"MAX CRISP",minutes:10,plate:!0,shakeAt:[5]}],ingredients:[{items:["400 г замороженных куриных наггетсов или рыбных палочек"]}],steps:["Выложить замороженный продукт на решётку в один слой.","MAX CRISP: наггетсы 10 минут, куриные палочки 9–10 минут, рыбные стрипсы 10 минут, сырные палочки 7–8 минут.","Встряхнуть в середине.","Проверить, что внутри горячо, и подавать."],tips:["Хочешь наггетсы и фри одновременно — загрузи обе корзины и нажми SYNC."],source:fe},{id:"basic-steak",title:"Стейк",category:"meat",summary:"Ровная корочка и та прожарка, которую любишь именно ты.",servings:"2 порции",prepMinutes:5,totalMinutes:12,mode:"SINGLE",zones:[{zone:1,title:"Стейк",fn:"AIR FRY",tempC:200,minutes:10,plate:!0,shakeAt:[5]}],ingredients:[{items:["2 стейка по 230 г","Растительное масло","Соль и перец"]}],steps:["Достать мясо из холодильника за 30 минут, обсушить, смазать маслом и приправить.","Вставить решётку и выложить стейки.","AIR FRY, 200 °C, 8–12 минут: 8 минут — прожарка слабее, 12 минут — well done.","Перевернуть в середине.","Обязательно дать мясу отдохнуть 5 минут под фольгой перед нарезкой."],source:fe},{id:"basic-pork-chops",title:"Свиные отбивные",category:"meat",summary:"Сочная свинина с румяной корочкой за 13 минут.",servings:"2–4 порции",prepMinutes:5,totalMinutes:13,mode:"SINGLE",zones:[{zone:1,title:"Отбивные",fn:"AIR FRY",tempC:200,minutes:12,plate:!0,shakeAt:[6]}],ingredients:[{items:["2 отбивные на кости по 250 г или 4 без кости по 100 г","Растительное масло","Соль, перец, специи"]}],steps:["Обсушить мясо, смазать маслом и приправить.","Вставить решётку и выложить в один слой.","AIR FRY, 200 °C: на кости 12–13 минут, без кости 10–12 минут.","Перевернуть в середине.","Дать отдохнуть 5 минут."],source:fe},{id:"basic-sausages",title:"Колбаски и сосиски",category:"meat",summary:"Восемь минут, ноль масла, ноль брызг на плите.",servings:"2–4 порции",prepMinutes:1,totalMinutes:10,mode:"SINGLE",zones:[{zone:1,title:"Колбаски",fn:"AIR FRY",tempC:200,minutes:9,plate:!0,shakeAt:[5]}],ingredients:[{items:["4 колбаски (205 г) или 8 штук (410 г)"]}],steps:["Выложить колбаски на решётку, масло не нужно.","AIR FRY, 200 °C: 4 штуки — 8 минут, 8 штук — 10 минут.","Один раз перевернуть или встряхнуть."],source:fe},{id:"basic-bacon",title:"Бекон",category:"meat",summary:"Идеально хрустящий бекон за 6 минут, весь жир стекает вниз.",servings:"2 порции",prepMinutes:1,totalMinutes:6,mode:"SINGLE",zones:[{zone:1,title:"Бекон",fn:"AIR FRY",tempC:220,minutes:6,plate:!0}],ingredients:[{items:["4 полоски бекона"]}],steps:["Выложить полоски на решётку, не накладывая друг на друга.","AIR FRY, 220 °C, 6 минут.","Проверить на 5-й минуте: тонкий бекон готовится быстрее."],source:fe},{id:"basic-duck-breast",title:"Утиная грудка",category:"meat",summary:"Хрустящая кожа и розовая серединка — ресторанное блюдо дома.",servings:"2 порции",prepMinutes:5,totalMinutes:22,mode:"SINGLE",zones:[{zone:1,title:"Утиная грудка",fn:"AIR FRY",tempC:200,minutes:20,plate:!0,shakeAt:[10]}],ingredients:[{items:["2 утиные грудки (400 г)","Растительное масло","Соль и перец"]}],steps:["Надрезать кожу решёткой, не задевая мясо. Приправить, слегка смазать маслом.","Выложить на решётку кожей вниз.","AIR FRY, 200 °C, 18–22 минуты.","Перевернуть примерно в середине приготовления.","Дать отдохнуть 5–10 минут и нарезать наискось."],source:fe},{id:"basic-salmon",title:"Филе лосося",category:"fish",summary:"Нежная рыба за 12 минут — почти невозможно испортить.",servings:"4 порции",prepMinutes:5,totalMinutes:13,mode:"SINGLE",zones:[{zone:1,title:"Лосось",fn:"AIR FRY",tempC:200,minutes:13,plate:!0}],ingredients:[{items:["4 филе лосося (около 520 г)","Растительное масло","Соль, перец, лимон"]}],steps:["Смазать филе маслом, посолить и поперчить.","Выложить на решётку кожей вниз, переворачивать не нужно.","AIR FRY, 200 °C, 12–14 минут.","Подавать с долькой лимона."],source:fe},{id:"basic-cod",title:"Филе трески",category:"fish",summary:"Самое быстрое блюдо в этой книге — 8 минут от начала до тарелки.",servings:"4 порции",prepMinutes:3,totalMinutes:8,mode:"SINGLE",zones:[{zone:1,title:"Треска",fn:"AIR FRY",tempC:200,minutes:7,plate:!0}],ingredients:[{items:["4 филе трески (480 г)","Растительное масло","Соль, перец, лимонный сок"]}],steps:["Обсушить филе, смазать маслом и приправить.","Выложить на решётку.","AIR FRY, 200 °C, 6–8 минут.","Рыба готова, когда легко расслаивается вилкой."],source:fe},{id:"basic-prawns",title:"Креветки за 4 минуты",category:"fish",summary:"Самая быстрая закуска. Главное — не передержать.",servings:"2 порции",prepMinutes:5,totalMinutes:4,mode:"SINGLE",zones:[{zone:1,title:"Креветки",fn:"AIR FRY",tempC:200,minutes:4,plate:!0}],ingredients:[{items:["16 крупных креветок (165 г)","1 ст. л. растительного масла","Чеснок, соль, перец, лимон"]}],steps:["Перемешать креветки с маслом, чесноком и специями.","Выложить на решётку в один слой.","AIR FRY, 200 °C, 3–4 минуты.","Готовы, как только стали розовыми и свернулись. Сбрызнуть лимоном."],source:fe},{id:"basic-roast-veg",title:"Овощи на гарнир",category:"veg",vegetarian:!0,summary:"Брокколи, цветная капуста, морковь, кабачки — всё при 200 °C, разница только во времени.",servings:"4 порции",prepMinutes:10,totalMinutes:14,mode:"SINGLE",zones:[{zone:1,title:"Овощи",fn:"AIR FRY",tempC:200,minutes:12,plate:!0,shakeAt:[6]}],ingredients:[{items:["400–600 г овощей на выбор","1–2 ст. л. растительного масла","Соль, перец, специи"]}],steps:["Нарезать овощи одинаковыми кусками, перемешать с маслом и специями.","Выложить на решётку ровным слоем.","AIR FRY, 200 °C. Время: спаржа 6–8 мин, стручковая фасоль 7–8 мин, кабачок 8–10 мин, цветная капуста 10–12 мин, брокколи 11 мин, пастернак 12–14 мин, морковь 14–16 мин, брюссельская капуста 13–15 мин, тыква 16–18 мин.","Встряхнуть в середине приготовления."],tips:["Свежим овощам нужна минимум 1 ст. л. масла, иначе они подсохнут, а не подрумянятся."],source:fe},{id:"basic-jacket-potato",title:"Картофель в мундире",category:"veg",vegetarian:!0,summary:"Хрустящая кожура и рассыпчатая мякоть — без включения духовки.",servings:"4 порции",prepMinutes:5,totalMinutes:40,mode:"SINGLE",zones:[{zone:1,title:"Картофель",fn:"AIR FRY",tempC:200,minutes:38,plate:!0,shakeAt:[20]}],ingredients:[{items:["4 картофелины по 185–250 г","1 ст. л. растительного масла","Крупная соль"]}],steps:["Вымыть картофель и проколоть вилкой в трёх местах.","Натереть маслом и щедро посыпать солью.","Выложить на решётку.","AIR FRY, 200 °C, 36–40 минут. Батат при той же температуре — 32–40 минут.","Перевернуть примерно в середине.","Готово, когда нож входит легко."],source:fe},{id:"basic-kale-chips",title:"Чипсы из капусты кале",category:"snacks",vegetarian:!0,summary:"Хрустящий полезный снек за 9 минут и совсем без масла.",servings:"2 порции",prepMinutes:5,totalMinutes:9,mode:"SINGLE",zones:[{zone:1,title:"Кале",fn:"AIR FRY",tempC:150,minutes:9,plate:!0}],ingredients:[{items:["225 г капусты кале","Соль по вкусу"]}],steps:["Оборвать жёсткие стебли, порвать листья на куски и хорошо обсушить.","Выложить на решётку, масло не нужно.","AIR FRY, 150 °C, 9 минут.","Аккуратно встряхнуть в середине — листья лёгкие, их сдувает вентилятором.","Посолить уже готовые чипсы."],source:fe},{id:"basic-corn",title:"Кукуруза в початках",category:"veg",vegetarian:!0,summary:"Запечённая кукуруза со сливочным маслом — вкус летнего вечера.",servings:"4 порции",prepMinutes:5,totalMinutes:16,mode:"SINGLE",zones:[{zone:1,title:"Кукуруза",fn:"AIR FRY",tempC:200,minutes:16,plate:!0,shakeAt:[8]}],ingredients:[{items:["4 початка кукурузы","1 ст. л. растительного масла или растопленное сливочное","Соль"]}],steps:["Очистить початки от листьев и срезать концы.","Смазать маслом и выложить на решётку.","AIR FRY, 200 °C, 15–18 минут. В режиме ROAST при 180 °C — 15 минут.","Повернуть початки в середине приготовления."],source:fe},{id:"basic-reheat-pizza",title:"Разогрев пиццы и вчерашней еды",category:"basics",summary:"Режим REHEAT возвращает хруст вместо резиновой корочки из микроволновки.",servings:"Сколько поместится",prepMinutes:1,totalMinutes:6,mode:"SINGLE",zones:[{zone:1,title:"Разогрев",fn:"REHEAT",tempC:160,minutes:5,plate:!0}],ingredients:[{items:["Вчерашняя пицца, пирог, блинчики, наггетсы, картофель фри"]}],steps:["Выложить еду на решётку в один слой.","REHEAT, около 160 °C, 4–6 минут.","Проверять с 3-й минуты: тонкие куски греются быстрее.","Пицца готова, когда сыр снова расплавился, а низ стал хрустящим."],tips:["Разогреваешь два разных блюда — задай каждой зоне своё время и нажми SYNC."],source:fe},{id:"basic-dried-apples",title:"Сушёные яблоки",category:"snacks",vegetarian:!0,summary:"Домашние яблочные чипсы без сахара — прибор работает тихо и сам.",servings:"Полная корзина",prepMinutes:15,totalMinutes:450,mode:"SINGLE",zones:[{zone:1,title:"Яблоки",fn:"DEHYDRATE",tempC:60,minutes:450,plate:!1}],ingredients:[{items:["Яблоки","Вода с лимонным соком","По желанию: корица"]}],steps:["Удалить сердцевину и нарезать яблоки кружками по 3 мм.","Сполоснуть в воде с лимонным соком, чтобы не потемнели, и обсушить.","Выложить на дно корзины в один слой без решётки.","DEHYDRATE, 60 °C, 7–8 часов.","Готовые ломтики хранить в плотно закрытой банке."],source:fe},{id:"basic-banana-chips",title:"Банановые чипсы",category:"snacks",vegetarian:!0,summary:"Сладкий снек без добавок — ночь работы, и к завтраку всё готово.",servings:"Полная корзина",prepMinutes:10,totalMinutes:540,mode:"SINGLE",zones:[{zone:1,title:"Бананы",fn:"DEHYDRATE",tempC:60,minutes:540,plate:!1}],ingredients:[{items:["Спелые, но плотные бананы"]}],steps:["Очистить и нарезать кружками по 3 мм.","Разложить на дне корзины в один слой без решётки.","DEHYDRATE, 60 °C, 8–10 часов.","Полностью остудить перед тем, как убирать в банку."],tips:["Сушка работает почти бесшумно — можно спокойно оставить на ночь."],source:fe},{id:"basic-jerky",title:"Вяленое мясо",category:"snacks",summary:"Домашний бор не нужно — это его большое преимущество перед духовкой."]},{kind:"note",text:"При первом включении может появиться лёгкий запах — это нормально для нового нагревательного элемента, он уйдёт через пару использований."}]},{id:"panel",title:"Панель управления",icon:"🎛️",blocks:[{kind:"text",text:"Все надписи на приборе английские, поэтому вот что означает каждая кнопка."},{kind:"table",head:["Кнопка","Что делает"],rows:[["ZONE 1","Выбрать левую корзину"],["ZONE 2","Выбрать правую корзину"],["TEMP ▲▼","Настроить температуру — до начала или прямо во время готовки"],["TIME ▲▼","Настроить время — до начала или во время готовки"],["SYNC","Синхронизация: обе корзины закончат одновременно, даже если время разное"],["MATCH","Копирует настройки Зоны 1 в Зону 2 — когда готовим одно и то же в обеих корзинах"],["Круглый диск","Поворотом выбирается режим, нажатием запускается и ставится на паузу приготовление"],["Кнопка питания","Включает и полностью выключает прибор"]]},{kind:"list",items:["HOLD на экране — зона ждёт своей очереди в режиме SYNC, это нормально.","End — приготовление в этой зоне закончено.","Экран погас — прибор ушёл в режим ожидания через 10 минут без действий. Нажми кнопку питания.","Буква E на экране — сбой прибора, нужно обратиться в сервис."]}]},{id:"functions",title:"Шесть режимов",icon:"🔥",blocks:[{kind:"table",head:["Режим","Для чего","Температура","Шаг таймера"],rows:[[`MAX CRISP

Обжарка горячим воздухом`,"Главный повседневный режим: свежие овощи, картошка, крылышки, котлеты, всё в панировке","До 210 °C","По 1 минуте, до 1 часа"],[`ROAST
Запекание`,"Работает как духовка: мясо куском, курица целиком, корнеплоды, фаршированные овощи","До 210 °C","По 1 минуте первый час, дальше по 5 минут, всего до 4 часов"],[`REHEAT
Разогрев`,"Вчерашняя пицца, пироги, блинчики — греет мягко и возвращает хруст, не пересушивая","До 210 °C","По 1 минуте, до 1 часа"],[`DEHYDRATE
Сушка`,"Сушёные яблоки, банановые чипсы, вяленое мясо, сушёные травы","От 40 до 70 °C","По 15 минут, до 12 часов"],[`BAKE
Выпечка`,"Кексы, брауни, печенье, запеканки под сырной корочкой","До 210 °C","По 1 минуте первые 30 минут, дальше по 5 минут, всего до 4 часов"]]},{kind:"note",text:"Если готовишь по рецепту для обычной духовки — ставь температуру на 10 °C ниже и проверяй блюдо почаще. Аэрогриль работает интенсивнее."}]},{id:"sync",title:"SYNC — два блюда, готовы одновременно",icon:"⏱️",blocks:[{kind:"text",text:"Самая любимая функция. Готовим два разных блюда с разными режимами, температурой и временем, а прибор сам рассчитывает, когда запустить вторую корзину, чтобы обе закончили минута в минуту. Например, курица 25 минут и овощи 15 минут — овощи подождут в режиме HOLD и стартуют позже."},{kind:"steps",items:["Разложить продукты по корзинам и вставить обе в прибор.","Прибор по умолчанию выбирает Зону 1. Повернуть диск и выбрать режим, например AIR FRY.","Стрелками TEMP выставить температуру, стрелками TIME — время.","Нажать ZONE 2 и повторить: свой режим, своя температура, своё время.","Нажать SYNC.","Нажать на диск — начнётся приготовление. На зоне с меньшим временем появится HOLD."]},{kind:"note",text:"Таймер сам встаёт на паузу, когда вынимаешь корзину, — можно спокойно встряхнуть содержимое. Но в режиме SYNC не держи корзину вынутой дольше 2 минут, иначе программа сбросится и её придётся задавать заново."}]},{id:"match",title:"MATCH — одно и то же в обеих корзинах",icon:"👯",blocks:[{kind:"text",text:"Когда готовим большую порцию одного блюда или два одинаковых по режиму блюда. Настраиваем только Зону 1, а MATCH копирует настройки в Зону 2."},{kind:"steps",items:["Разложить продукты по обеим корзинам и вставить их в прибор.","Для Зоны 1 выбрать диском режим, задать температуру и время.","Нажать MATCH — настройки продублируются в Зону 2.","Нажать на диск, чтобы начать."]}]},{id:"single",title:"Одна зона и две зоны без синхронизации",icon:"🍽️",blocks:[{kind:"text",text:"Готовишь что-то одно? Загрузи одну корзину и пользуйся прибором как обычной аэрофритюрницей: выбери зону, режим, температуру, время и нажми на диск. Вторая корзина при этом просто не участвует."},{kind:"text",text:"Нужны два блюда, но не важно, чтобы они закончили одновременно? Заполни обе корзины, задай каждой зоне свои настройки вручную и нажми на диск — обе стартуют сразу."},{kind:"list",items:["Остановить одну зону во время готовки: нажать кнопку этой зоны, затем нажать на диск.","Остановить обе зоны сразу: просто нажать на диск.","Менять температуру и время можно в любой момент — выбрать зону и нажать стрелки TEMP или TIME."]}]},{id:"plate",title:"Решётка-подставка: когда класть",icon:"🧺",blocks:[{kind:"text",text:"Решётка (crisper plate) приподнимает продукты над дном, чтобы горячий воздух обдувал их со всех сторон. Именно она даёт равномерную румяную корочку."},{kind:"list",items:["Ставим всегда в режиме AIR FRY и почти во всех рецептах — если не сказано иное.","Убираем, когда готовим что-то жидкое или сыпучее: брауни, запеканку, фарш, тушёные овощи, груши в сиропе.","Если в рецепте решётка не упомянута — проверь, что ты её вынула, прежде чем закладывать продукты."]}]},{id:"tips",title:"Секреты идеального результата",icon:"💡",blocks:[{kind:"list",items:["Выкладывай продукты одним ровным слоем, не наваливая друг на друга — иначе получится не жарка, а тушение.","Встряхивай корзину или переворачивай щипцами почаще: обычно в середине приготовления и ещё раз ближе к концу. Таймер сам поставится на паузу.","Свежим овощам и картошке нужна минимум 1 столовая ложка масла. Хочешь хрустящее — добавь до 3 ложек.","Картофель фри домашней нарезки замочи в холодной воде на 30 минут и хорошо обсуши. Чем суше картошка, тем лучше корочка.","Панировка держится в три слоя: мука, затем яйцо, затем сухари. Сухари прижимай плотно, иначе вентилятор их сдует.","Лёгкие продукты (например, верхний ломтик хлеба в бутерброде) закрепляй зубочисткой.","Мясо и рыбу проверяй термометром: курица готова при 75 °C внутри.","Доставай еду сразу по окончании таймера — в горячей корзине она продолжает готовиться.","Нет твоего продукта в таблицах? Возьми время с упаковки и уменьши на 25 %, дальше проверяй."]}]},{id:"clean",title:"Чистка и уход",icon:"🧽",blocks:[{kind:"text",text:"Мыть после каждого использования. Сначала вынуть вилку из розетки и дать прибору полностью остыть."},{kind:"table",head:["Что","Как мыть","Посудомойка"],rows:[["Основной блок и панель","Протереть влажной тканью. Никогда не погружать в воду","Нельзя"],["Корзины и решётки","Тёплая вода с моющим средством, затем насухо вытереть","Можно, но вручную бережнее для покрытия"]]},{kind:"list",items:["Прилипшие остатки: залей корзину тёплой водой с моющим средством и дай отмокнуть.","Не пользуйся металлическими щётками и абразивами — они портят антипригарное покрытие.","Пользуйся силиконовыми или деревянными щипцами и лопатками, не металлическими."]}]},{id:"faq",title:"Вопросы и неполадки",icon:"❓",blocks:[{kind:"table",head:["Вопрос","Ответ"],rows:[["Нужно ли разогревать прибор заранее?","Нет, он готов сразу."],["Не смешаются ли запахи между корзинами?","Нет. У каждой зоны свой нагреватель и свой вентилятор, они полностью автономны."],["Как поставить на паузу?","Просто вынуть корзину — отсчёт остановится сам. Вставишь обратно — продолжится."],["Почему еда не пропеклась?","Проверь, что корзина вставлена до конца, продукты лежат ровным слоем и не навалены горкой. Встряхни и при необходимости добавь время стрелками TIME."],["Почему еда подгорела?","Аэрогриль быстрее духовки. Проверяй за пару минут до конца и доставай сразу, как достигнут нужный цвет."],["Почему лёгкие продукты разлетаются?","Их сдувает вентилятор. Закрепи зубочисткой или прижми сверху решёткой."],["Можно ли готовить в кляре?","Да, но нужна правильная панировка: мука, яйцо, сухари, плотно прижать."],["Почему прибор пищит?","Либо приготовление закончено, либо в режиме SYNC включилась вторая зона."],["Экран погас","Режим ожидания после 10 минут бездействия. Нажми кнопку питания."],["На экране буква E","Неисправность. Нужно обратиться в сервис Ninja."]]}]},{id:"safety",title:"Безопасность",icon:"⚠️",blocks:[{kind:"list",items:["Прибор и шнур держать подальше от детей.","Ничего не ставить на прибор во время работы.","Не ставить рядом с горячей плитой, в духовку и на горячие поверхности.","Не пользоваться удлинителем и не подключать через внешний таймер или умную розетку с дистанционным управлением.","Не погружать корпус, шнур и вилку в воду.","Регулярно осматривать шнур. При повреждении прибором не пользоваться.","Горячая корзина: не ставить её сверху на прибор, использовать прихватку и подставку."]}]}];function _c({block:h}){switch(h.kind){case"text":return u.jsx("p",{children:h.text});case"note":return u.jsx("div",{className:"note-box",children:h.text});case"list":return u.jsx("ul",{className:"clean",children:h.items.map(v=>u.jsx("li",{children:v},v))});case"steps":return u.jsx("ol",{className:"clean",children:h.items.map(v=>u.jsx("li",{children:v},v))});case"table":return u.jsx("div",{className:"table-wrap",children:u.jsxs("table",{children:[u.jsx("thead",{children:u.jsx("tr",{children:h.head.map(v=>u.jsx("th",{children:v},v))})}),u.jsx("tbody",{children:h.rows.map((v,p)=>u.jsx("tr",{children:v.map((O,j)=>u.jsx("td",{children:O},`${O}-${j}`))},`${v[0]}-${p}`))})]})})}}function Ic(){const[h,v]=V.useState(ro[0].id);return u.jsxs("div",{children:[u.jsx("h1",{className:"screen-title",children:"Как пользоваться"}),u.jsx("p",{className:"screen-sub",children:"Вся инструкция к Ninja AF400EU по-русски: что означает каждая кнопка и как получить лучший результат."}),ro.map(p=>{const O=h===p.id;return u.jsxs("div",{className:"guide-item",children:[u.jsxs("button",{className:"guide-head",type:"button",onClick:()=>v(O?null:p.id),children:[u.jsx("span",{style:{fontSize:20},children:p.icon}),u.jsx("span",{children:p.title}),u.jsx("span",{className:`arrow ${O?"open":""}`,children:"›"})]}),O&&u.jsx("div",{className:"guide-body",children:p.blocks.map((j,L)=>u.jsx(_c,{block:j},L))})]},p.id)})]})}function Fc({data:h,onOpen
